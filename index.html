<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>העוזר החכם</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f0f2f5; padding: 12px; color: #1c1e21; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #e4e6eb; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #0088cc; color: white; }
    .section { display: none; }
    .section.active { display: block; }
    
    .chat-container { background: white; border-radius: 10px; height: 350px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
    .msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; font-size: 15px; }
    .msg.user { background: #0088cc; color: white; align-self: flex-start; }
    .msg.ai { background: #eef2f5; color: #333; align-self: flex-end; }
    .input-row { display: flex; gap: 6px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
    .btn { background: #0088cc; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
    .settings-box { background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border: 1px solid #ffeeba; }
  </style>
</head>
<body>

  <!-- אזור הגדרות מהיר שנשמר בטלפון -->
  <div id="setup-box" class="settings-box">
    <strong>⚙️ הגדרה ראשונית בטלפון:</strong>
    <input type="text" id="keyInput" placeholder="הדבק כאן מפתח Gemini (מתחיל ב-AIza...)" style="margin-top: 5px; width: 100%;">
    <button class="btn" onclick="saveKey()" style="margin-top: 5px; width: 100%;">שמור מפתח במכשיר</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('ai')">עוזר AI</button>
    <button class="tab-btn" onclick="setTab('files')">קבצים</button>
  </div>

  <!-- לשונית AI -->
  <div id="ai-section" class="section active">
    <div class="chat-container" id="chatBox">
      <div class="msg ai">שלום! אני כאן לעזור לך. תוכל לשאול אותי כל דבר!</div>
    </div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="הקלד הודעה..." onkeyup="if(event.key==='Enter') sendAI()">
      <button class="btn" onclick="sendAI()">שלח</button>
    </div>
  </div>

  <!-- לשונית קבצים -->
  <div id="files-section" class="section">
    <input type="text" id="fileFilter" placeholder="חפש קובץ..." onkeyup="filterFiles()" style="margin-bottom: 10px; width: 100%;">
    <div id="fileList"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // בדיקה אם המפתח כבר שמור במכשיר
    let savedKey = localStorage.getItem("GEMINI_KEY") || "";
    if (savedKey) {
      document.getElementById("setup-box").style.display = "none";
    }

    function saveKey() {
      const val = document.getElementById("keyInput").value.trim();
      if (!val) return alert("אנא הזן מפתח תקין");
      localStorage.setItem("GEMINI_KEY", val);
      savedKey = val;
      document.getElementById("setup-box").style.display = "none";
      alert("המפתח נשמר בהצלחה במכשיר שלך!");
    }

    function setTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if(tab === 'ai') {
        document.getElementById('ai-section').classList.add('active');
        event.target.classList.add('active');
      } else {
        document.getElementById('files-section').classList.add('active');
        event.target.classList.add('active');
        renderFiles(sampleFiles);
      }
    }

    async function sendAI() {
      if (!savedKey) {
        document.getElementById("setup-box").style.display = "block";
        return alert("אנא הזן ושמור תחילה את מפתח ה-Gemini למעלה");
      }

      const input = document.getElementById('userInput');
      const box = document.getElementById('chatBox');
      const text = input.value.trim();
      if (!text) return;

      box.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";
      box.scrollTop = box.scrollHeight;

      const loadingId = "load_" + Date.now();
      box.innerHTML += `<div class="msg ai" id="${loadingId}">חושב...</div>`;
      box.scrollTop = box.scrollHeight;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${savedKey}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "לא התקבלה תשובה מהמודל.";
        document.getElementById(loadingId).innerText = reply;
      } catch (err) {
        document.getElementById(loadingId).innerText = "שגיאה בתקשורת מול ה-AI.";
      }
      box.scrollTop = box.scrollHeight;
    }

    const sampleFiles = [
      { name: "מדריך פייתון מלא.pdf", size: "12.4 MB" },
      { name: "קורס בינה מלאכותית.mp4", size: "145.8 MB" },
      { name: "ארכיון מסמכים.zip", size: "850.2 MB" }
    ];

    function renderFiles(files) {
      const container = document.getElementById('fileList');
      container.innerHTML = "";
      files.forEach(f => {
        container.innerHTML += `
          <div class="card">
            <div>
              <strong>${f.name}</strong><br>
              <small style="color: gray;">משקל: ${f.size}</small>
            </div>
            <button class="btn" style="background:#28a745;" onclick="alert('הקובץ יישלח לטלגרם שלך!')">קבל קובץ</button>
          </div>
        `;
      });
    }

    function filterFiles() {
      const q = document.getElementById('fileFilter').value.toLowerCase();
      renderFiles(sampleFiles.filter(f => f.name.toLowerCase().includes(q)));
    }
  </script>
</body>
</html>
